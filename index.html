<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>URFree</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="app">
    <section id="top" aria-live="polite">
      <div id="circles" aria-hidden="true"></div>

      <div id="special" hidden></div>

      <div id="elapsed" hidden>
        <div class="time-unit year-unit">
          <div class="indicator-stack" id="yearStack"></div>
          <div class="time-value"><span id="yearsValue">0</span><span class="unit">y.</span></div>
        </div>

        <div class="time-unit">
          <div class="indicator single-indicator" id="monthIndicator"></div>
          <div class="time-value"><span id="monthsValue">0</span><span class="unit">m.</span></div>
        </div>

        <div class="time-unit">
          <div class="indicator single-indicator" id="dayIndicator"></div>
          <div class="time-value"><span id="daysValue">0</span><span class="unit">d.</span></div>
        </div>

        <div class="time-unit">
          <div class="indicator single-indicator" id="hourIndicator"></div>
          <div class="time-value"><span id="hoursValue">0</span><span class="unit">h.</span></div>
        </div>
      </div>
    </section>

    <div id="money"><span class="whole">0</span><span class="fraction"><span class="separator">,</span>00</span></div>
  </main>

  <script src="settings.js"></script>
  <script src="app.js"></script>
</body>
</html>
